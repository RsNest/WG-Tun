# Live overlay scrape config. Used by docker-compose.live.yml, not by the
# default compose stack (that file still scrapes agent:9101 on the bridge net).
#
# The live agent uses network_mode: host, so it is not on the Compose network
# and the DNS name "agent" does not exist for prometheus. host-gateway
# (Docker ≥ 20.10, Linux Engine) is the host's bridge IP; the agent must
# listen on 0.0.0.0:9101 (see configs/docker-agent.live.yaml).
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: transitforge-controller
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["controller:8443"]
  - job_name: transitforge-agent
    scheme: http
    static_configs:
      - targets: ["agent-host:9101"]
