name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Go test/vet/gofmt in Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          platforms: linux/amd64
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=proxyctl-test
          cache-to: type=gha,scope=proxyctl-test,mode=max

      - name: Build controller
        uses: docker/build-push-action@v6
        with:
          context: .
          target: controller
          load: true
          tags: ghcr.io/rsnest/wg-tun-controller:ci
          platforms: linux/amd64
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=proxyctl-controller
          cache-to: type=gha,scope=proxyctl-controller,mode=max

      - name: Build agent
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          load: true
          tags: ghcr.io/rsnest/wg-tun-agent:ci
          platforms: linux/amd64
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=proxyctl-agent
          cache-to: type=gha,scope=proxyctl-agent,mode=max

      - name: Build proxctl
        uses: docker/build-push-action@v6
        with:
          context: .
          target: proxctl
          load: true
          tags: ghcr.io/rsnest/wg-tun-proxctl:ci
          platforms: linux/amd64
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=proxyctl-proxctl
          cache-to: type=gha,scope=proxyctl-proxctl,mode=max

      - name: Image smoke (version + health + no secrets)
        env:
          CONTROLLER_IMAGE: ghcr.io/rsnest/wg-tun-controller:ci
          AGENT_IMAGE: ghcr.io/rsnest/wg-tun-agent:ci
          PROXCTL_IMAGE: ghcr.io/rsnest/wg-tun-proxctl:ci
        run: bash scripts/docker-ci-smoke.sh
