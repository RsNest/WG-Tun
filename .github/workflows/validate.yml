name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Go test/vet/gofmt in Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          platforms: linux/amd64
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=transitforge-test
          cache-to: type=gha,scope=transitforge-test,mode=max

      - name: Build controller
        uses: docker/build-push-action@v6
        with:
          context: .
          target: controller
          load: true
          tags: ghcr.io/rsnest/transitforge-controller:ci
          platforms: linux/amd64
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=transitforge-controller
          cache-to: type=gha,scope=transitforge-controller,mode=max

      - name: Build agent
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          load: true
          tags: ghcr.io/rsnest/transitforge-agent:ci
          platforms: linux/amd64
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=transitforge-agent
          cache-to: type=gha,scope=transitforge-agent,mode=max

      - name: Build transitforge
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cli
          load: true
          tags: ghcr.io/rsnest/transitforge-cli:ci
          platforms: linux/amd64
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=transitforge-cli
          cache-to: type=gha,scope=transitforge-cli,mode=max

      - name: Image smoke (version + health + no secrets)
        env:
          CONTROLLER_IMAGE: ghcr.io/rsnest/transitforge-controller:ci
          AGENT_IMAGE: ghcr.io/rsnest/transitforge-agent:ci
          CLI_IMAGE: ghcr.io/rsnest/transitforge-cli:ci
        run: bash scripts/docker-ci-smoke.sh
