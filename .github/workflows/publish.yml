name: publish-images

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/rsnest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version args
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Go test/vet/gofmt in Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
          cache-from: type=gha,scope=proxyctl-test
          cache-to: type=gha,scope=proxyctl-test,mode=max

      - name: Controller metadata
        id: meta-controller
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rsnest/wg-tun-controller
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Agent metadata
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rsnest/wg-tun-agent
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: proxctl metadata
        id: meta-proxctl
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rsnest/wg-tun-proxctl
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Build controller (no push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: controller
          load: true
          tags: ghcr.io/rsnest/wg-tun-controller:ci
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
            CREATED=${{ steps.ver.outputs.created }}
          cache-from: type=gha,scope=proxyctl-controller
          cache-to: type=gha,scope=proxyctl-controller,mode=max

      - name: Build agent (no push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          load: true
          tags: ghcr.io/rsnest/wg-tun-agent:ci
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
            CREATED=${{ steps.ver.outputs.created }}
          cache-from: type=gha,scope=proxyctl-agent
          cache-to: type=gha,scope=proxyctl-agent,mode=max

      - name: Build proxctl (no push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: proxctl
          load: true
          tags: ghcr.io/rsnest/wg-tun-proxctl:ci
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
            CREATED=${{ steps.ver.outputs.created }}
          cache-from: type=gha,scope=proxyctl-proxctl
          cache-to: type=gha,scope=proxyctl-proxctl,mode=max

      - name: Image smoke before publish
        env:
          CONTROLLER_IMAGE: ghcr.io/rsnest/wg-tun-controller:ci
          AGENT_IMAGE: ghcr.io/rsnest/wg-tun-agent:ci
          PROXCTL_IMAGE: ghcr.io/rsnest/wg-tun-proxctl:ci
        run: bash scripts/docker-ci-smoke.sh

      - name: Push controller
        uses: docker/build-push-action@v6
        with:
          context: .
          target: controller
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta-controller.outputs.tags }}
          labels: ${{ steps.meta-controller.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
            CREATED=${{ steps.ver.outputs.created }}
          cache-from: type=gha,scope=proxyctl-controller

      - name: Push agent
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
            CREATED=${{ steps.ver.outputs.created }}
          cache-from: type=gha,scope=proxyctl-agent

      - name: Push proxctl
        uses: docker/build-push-action@v6
        with:
          context: .
          target: proxctl
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta-proxctl.outputs.tags }}
          labels: ${{ steps.meta-proxctl.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
            CREATED=${{ steps.ver.outputs.created }}
          cache-from: type=gha,scope=proxyctl-proxctl
