# Local source-build lab (Docker Engine + Compose). Canonical images:
#   ghcr.io/rsnest/wg-tun-{controller,agent,transitforge}
# Release pull (no build): docker-compose.release.yml + TRANSITFORGE_VERSION.
# Live Linux overlay: docker-compose.live.yml (see docs/DOCKER.md).
name: transitforge

services:
  controller:
    build:
      context: .
      target: controller
    image: transitforge-controller:local
    hostname: controller
    ports:
      - "8443:8443"
    volumes:
      - transitforge-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/transitforge-controller", "healthcheck", "--url", "https://127.0.0.1:8443/readyz", "-k"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  bootstrap:
    build:
      context: .
      target: cli
    image: transitforge-cli:local
    depends_on:
      controller:
        condition: service_healthy
    volumes:
      - transitforge-data:/data:ro
    environment:
      TRANSITFORGE_CONTROLLER: https://controller:8443
      TRANSITFORGE_TOKEN_FILE: /data/bootstrap.token
      TRANSITFORGE_INSECURE: "true"
      TRANSITFORGE_NODE_NAME: ru-edge-1
    entrypoint: ["/usr/local/bin/docker-bootstrap.sh"]
    restart: "no"

  agent:
    build:
      context: .
      target: agent
    image: transitforge-agent:local
    hostname: ru-edge-1
    depends_on:
      controller:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "9101:9101"
    volumes:
      - transitforge-data:/data:ro
      - ./configs/docker-agent.yaml:/etc/transitforge/agent.yaml:ro
    restart: unless-stopped

  cli:
    image: transitforge-cli:local
    profiles: ["cli"]
    depends_on:
      controller:
        condition: service_healthy
    volumes:
      - transitforge-data:/data:ro
    working_dir: /data
    entrypoint: ["transitforge", "--controller", "https://controller:8443", "--token-file", "/data/bootstrap.token", "--insecure"]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["obs"]
    volumes:
      - ./deploy/prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - controller
      - agent

volumes:
  transitforge-data:
