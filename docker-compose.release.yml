# Pull GHCR images instead of building from source.
# Requires TRANSITFORGE_VERSION (immutable sha-* or release v* tag). Do not use "latest".
#
#   TRANSITFORGE_VERSION=sha-abcdef1 docker compose -f docker-compose.yml -f docker-compose.release.yml pull
#   TRANSITFORGE_VERSION=sha-abcdef1 docker compose -f docker-compose.yml -f docker-compose.release.yml up -d
name: transitforge

services:
  controller:
    image: ghcr.io/rsnest/transitforge-controller:${TRANSITFORGE_VERSION:?TRANSITFORGE_VERSION is required}
    build: !reset null
  bootstrap:
    image: ghcr.io/rsnest/transitforge-cli:${TRANSITFORGE_VERSION:?TRANSITFORGE_VERSION is required}
    build: !reset null
  agent:
    image: ghcr.io/rsnest/transitforge-agent:${TRANSITFORGE_VERSION:?TRANSITFORGE_VERSION is required}
    build: !reset null
  cli:
    image: ghcr.io/rsnest/transitforge-cli:${TRANSITFORGE_VERSION:?TRANSITFORGE_VERSION is required}
