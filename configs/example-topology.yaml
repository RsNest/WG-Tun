# Illustrative topology only — never imported by internal/ packages.
# RU edge node with two overlay backends (WireGuard primary, SSH TUN fallback).

node:
  name: ru-edge-1
  public_ip: 203.0.113.10

backends:
  - name: backend-a
    address: 10.200.1.2
  - name: backend-b
    address: 10.200.2.2

tunnels:
  - backend: backend-a
    type: WIREGUARD
    interface_name: wg-a
    local_overlay_ip: 10.200.1.1
    remote_overlay_ip: 10.200.1.2
    listen_port: 51820
    endpoint: 198.51.100.20:51820
    allowed_ips: ["10.200.1.2/32"]
    persistent_keepalive: 25
    priority: 10
    private_key_path: /etc/transitforge/keys/wg-a.key
  - backend: backend-b
    type: SSH_TUN
    interface_name: tun-b
    local_overlay_ip: 10.200.2.1
    remote_overlay_ip: 10.200.2.2
    service_name: transitforge-ssh-backend-b.service
    priority: 20

mappings:
  - backend: backend-a
    protocol: UDP
    public_port: 51821
    backend_port: 51820
  - backend: backend-a
    protocol: TCP
    public_port: 443
    backend_port: 443

sni:
  node: ru-edge-1
  listen: ":443"
  matches:
    - match: example.com
      backend: backend-a
    - default: true
      backend: backend-b
